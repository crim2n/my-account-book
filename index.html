<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마트 가계부 Pro</title>
<meta name="description" content="Google, Kakao, Email로 로그인하는 스마트 가계부">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root { --primary:#03cf5d; --bg:#f4f6f8; }
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
}
.app{width:100%;max-width:500px;min-height:100vh;background:#fff}
.hidden{display:none}
input,select,button{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ddd;
  box-sizing:border-box;
}
button{
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:var(--primary);color:#fff}
.google{background:#fff;border:1px solid #ddd}
.kakao{background:#fee500;color:#000}
.gray{background:#888;color:#fff}
.summary{
  background:var(--primary);
  color:#fff;
  padding:25px;
  margin:15px;
  border-radius:20px;
}
.item{
  padding:15px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
}
.btns{display:flex;gap:5px;margin-top:5px}
.small{padding:4px 10px;font-size:11px}
.edit{background:#3498db;color:#fff}
.del{background:#e74c3c;color:#fff}
.warning{
  background:#ffeded;
  color:#ff4d4d;
  padding:12px;
  margin:15px;
  border-radius:10px;
  text-align:center;
  font-size:13px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- ================= 로그인 ================= -->
<div id="auth" class="app" style="padding:40px 20px;text-align:center">
<h2 style="color:var(--primary)">스마트 가계부 Pro</h2>

<button class="google" onclick="oauthLogin('google')">🔵 Google로 시작하기</button>
<button class="kakao" onclick="oauthLogin('kakao')">🟡 Kakao로 시작하기</button>

<hr style="margin:25px 0">

<input id="email" type="email" placeholder="이메일">
<input id="password" type="password" placeholder="비밀번호 (6자 이상)">
<button class="primary" onclick="emailLogin()">이메일 로그인</button>
<button class="gray" onclick="emailSignup()">이메일 회원가입</button>
</div>

<!-- ================= 메인 앱 ================= -->
<div id="main" class="app hidden">

<header class="summary">
  <div style="display:flex;justify-content:space-between;font-size:12px">
    <span id="userEmail"></span>
    <span style="cursor:pointer;text-decoration:underline" onclick="logout()">로그아웃</span>
  </div>
  <div style="font-size:14px">이번 달 총 지출</div>
  <h2 id="totalAmount">0원</h2>
  <div id="budgetInfo" style="font-size:12px;opacity:.8">한도 미설정</div>
</header>

<div id="budgetWarning" class="warning hidden">🚨 예산 초과!</div>

<div style="padding:10px 20px">
  <canvas id="expenseChart"></canvas>
</div>

<div style="padding:20px">
  <input id="budgetInput" type="number" placeholder="월 지출 한도">
  <button class="primary" onclick="setBudget()">한도 설정</button>
</div>

<div style="padding:20px;border-top:5px solid #f4f6f8">
  <h4 id="formTitle">지출 추가</h4>
  <input type="hidden" id="editId">
  <input id="date" type="date">
  <select id="category">
    <option>식비</option><option>교통비</option><option>쇼핑</option><option>기타</option>
  </select>
  <input id="amount" type="number" placeholder="금액">
  <input id="memo" type="text" placeholder="메모">
  <button class="primary" onclick="saveExpense()">저장</button>
</div>

<div id="history"></div>

</div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  SUPABASE_URL: 'https://bynawxhwdshjjudwczju.supabase.co',
  SUPABASE_KEY: 'sb_publishable_7Y23Naq_v7I7jAIszAVfUg_Hd5XRYwb',
  REDIRECT_URL: window.location.origin
};

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
let chart=null;
let budget=localStorage.getItem('budget')||0;

/* ================= AUTH ================= */
sb.auth.getSession().then(({data})=>{
  if(data.session) showMain(data.session.user);
});

function oauthLogin(provider){
  sb.auth.signInWithOAuth({
    provider,
    options:{ redirectTo: CONFIG.REDIRECT_URL }
  });
}

async function emailLogin(){
  const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});
  if(error) return alert(error.message);
  showMain(data.user);
}

async function emailSignup(){
  const {error}=await sb.auth.signUp({email:email.value,password:password.value});
  if(error) alert(error.message);
  else alert("가입 완료! 로그인하세요.");
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* ================= UI ================= */
function showMain(user){
  auth.classList.add('hidden');
  main.classList.remove('hidden');
  userEmail.innerText=user.email;
  date.valueAsDate=new Date();
  loadData();
}

/* ================= 가계부 ================= */
function setBudget(){
  budget=budgetInput.value;
  localStorage.setItem('budget',budget);
  loadData();
}

async function saveExpense(){
  const {data:{user}}=await sb.auth.getUser();
  const payload={
    user_id:user.id,
    date:date.value,
    category:category.value,
    amount:+amount.value,
    memo:memo.value||category.value
  };
  await sb.from('expenses').insert([payload]);
  amount.value=memo.value="";
  loadData();
}

async function loadData(){
  const {data}=await sb.from('expenses').select('*').order('date',{ascending:false});
  const total=data.reduce((s,i)=>s+i.amount,0);
  totalAmount.innerText=total.toLocaleString()+'원';

  if(budget>0){
    budgetInfo.innerText=`한도 ${(+budget).toLocaleString()}원`;
    budgetWarning.classList.toggle('hidden',total<budget);
  }

  history.innerHTML=data.map(i=>`
    <div class="item">
      <div><b>${i.memo}</b><br><small>${i.date}</small></div>
      <div>- ${i.amount.toLocaleString()}원</div>
    </div>
  `).join('');

  updateChart(data);
}

function updateChart(data){
  const cats=['식비','교통비','쇼핑','기타'];
  const sums=cats.map(c=>data.filter(i=>i.category===c).reduce((s,i)=>s+i.amount,0));
  if(chart) chart.destroy();
  chart=new Chart(expenseChart,{
    type:'doughnut',
    data:{labels:cats,datasets:[{data:sums}]}
  });
}
</script>

</body>
</html>
