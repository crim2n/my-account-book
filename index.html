<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스마트 가계부 Pro + Tetris</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --primary:#03c75a;
  --bg:#f6f7f9;
  --card:#fff;
  --border:#e5e7eb;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  padding-bottom:90px;
}
.hidden{display:none}

/* 카드 */
.card{
  background:var(--card);
  margin:16px;
  padding:20px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

input,select,button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid var(--border);
}

button{
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--primary);color:#fff}
.google{background:#fff}
.kakao{background:#fee500}
.gray{background:#aaa;color:#fff}
.edit{background:#3498db;color:#fff}
.del{background:#e74c3c;color:#fff}

/* 요약 */
.summary{
  background:linear-gradient(135deg,#03c75a,#02b350);
  color:#fff;
  padding:28px;
  margin:16px;
  border-radius:22px;
}

/* 내역 */
.item{
  background:#fff;
  margin:10px 16px;
  padding:16px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  box-shadow:0 3px 10px rgba(0,0,0,.04);
}
.btns{display:flex;gap:6px;margin-top:6px}
.small{padding:6px;font-size:11px}

/* 탭바 */
.tabbar{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  max-width:500px;
  width:100%;
  background:#fff;
  border-top:1px solid var(--border);
  display:flex;
  z-index: 1000;
}
.tab{
  flex:1;
  padding:12px 0;
  text-align:center;
  font-size:12px;
  cursor:pointer;
}
.tab.active{color:var(--primary);font-weight:bold}

/* 테트리스 전용 스타일 */
#game .card { position: relative; padding: 15px; }
#tetris {
  background: #000;
  display: block;
  margin: 0 auto;
  border: 2px solid #333;
  width: 200px;
  height: 360px;
}
.game-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #333; }
.game-controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}
.btn-game {
  padding: 12px;
  margin-bottom: 0;
  background: #f0f0f0;
  border: 1px solid #ddd;
  font-size: 18px;
}
.btn-game:active { background: #ddd; }
</style>
</head>

<body>

<div id="auth" class="app" style="padding:40px 20px;text-align:center">
  <h2 style="color:var(--primary)">스마트 가계부 Pro</h2>
  <button class="google" onclick="oauthLogin('google')">🔵 Google로 시작하기</button>
  <button class="kakao" onclick="oauthLogin('kakao')">🟡 Kakao로 시작하기</button>
  <hr style="margin:25px 0">
  <input id="email" type="email" placeholder="이메일">
  <input id="password" type="password" placeholder="비밀번호">
  <button class="primary" onclick="emailLogin()">이메일 로그인</button>
  <button class="gray" onclick="emailSignup()">이메일 회원가입</button>
</div>

<div id="main" class="app hidden">

<section id="home">
  <header class="summary">
    <small id="userEmail"></small>
    <h2 id="totalAmount">0원</h2>
  </header>
  <div class="card">
    <input id="budgetInput" placeholder="월 예산">
    <button class="primary" onclick="setBudget()">예산 저장</button>
  </div>
  <div class="card">
    <h4>지출 추가 / 수정</h4>
    <input type="hidden" id="editId">
    <input id="date" type="date">
    <select id="category">
      <option>식비</option><option>교통비</option><option>쇼핑</option><option>기타</option>
    </select>
    <input id="amount" type="number" placeholder="금액">
    <input id="memo" placeholder="메모">
    <button class="primary" onclick="saveExpense()">저장</button>
  </div>
  <div id="history"></div>
</section>

<section id="stats" class="hidden">
  <div class="card">
    <canvas id="expenseChart"></canvas>
  </div>
</section>

<section id="settings" class="hidden">
  <div class="card">
    <button class="gray" onclick="logout()">로그아웃</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="card">
    <div class="game-info">
      <span id="game-score">점수: 0</span>
      <span id="game-level">레벨: 1</span>
    </div>
    <canvas id="tetris" width="200" height="360"></canvas>
    
    <div class="game-controls">
      <button class="btn-game" onclick="playerRotate(1)">↻</button>
      <button class="btn-game" onclick="playerMove(-1)">←</button>
      <button class="btn-game" onclick="playerMove(1)">→</button>
      <button style="grid-column: 2" class="btn-game" onclick="playerDrop()">↓</button>
    </div>
  </div>
</section>

</div>

<div id="tabbar" class="tabbar hidden">
  <div class="tab active" onclick="showTab('home',this)">홈</div>
  <div class="tab" onclick="showTab('stats',this)">통계</div>
  <div class="tab" onclick="showTab('settings',this)">설정</div>
  <div class="tab" onclick="showTab('game',this); initTetris();">🎮</div>
</div>

<script>
/* ================= CONFIG ================= */
const sb=supabase.createClient(
 'https://bynawxhwdshjjudwczju.supabase.co',
 'sb_publishable_7Y23Naq_v7I7jAIszAVfUg_Hd5XRYwb'
);
let chart=null;

/* ================= AUTH ================= */
sb.auth.getSession().then(({data})=>{
 if(data.session) showMain(data.session.user);
});

async function oauthLogin(provider){
 await sb.auth.signInWithOAuth({
  provider,
  options:{redirectTo:location.origin}
 });
}

async function emailLogin(){
 const {data,error}=await sb.auth.signInWithPassword({
  email:email.value,
  password:password.value
 });
 if(error) return alert(error.message);
 showMain(data.user);
}

async function emailSignup(){
 const {error}=await sb.auth.signUp({
  email:email.value,
  password:password.value
 });
 if(error) alert(error.message);
 else alert('가입 완료! 로그인하세요.');
}

async function logout(){
 await sb.auth.signOut();
 location.reload();
}

/* ================= UI ================= */
function showMain(user){
 auth.classList.add('hidden');
 main.classList.remove('hidden');
 tabbar.classList.remove('hidden');
 userEmail.innerText=user.email;
 date.valueAsDate=new Date();
 loadData();
}

function showTab(id,el){
 document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 el.classList.add('active');
}

/* ================= 가계부 ================= */
async function saveExpense(){
 const {data:{user}}=await sb.auth.getUser();
 const payload={
  user_id:user.id,
  date:date.value,
  category:category.value,
  amount:+amount.value,
  memo:memo.value
 };
 editId.value
 ? await sb.from('expenses').update(payload).eq('id',editId.value)
 : await sb.from('expenses').insert([payload]);

 editId.value=""; amount.value=memo.value="";
 loadData();
}

function editExpense(i){
 editId.value=i.id;
 date.value=i.date;
 category.value=i.category;
 amount.value=i.amount;
 memo.value=i.memo;
}

async function delExpense(id){
 if(confirm('삭제할까요?')){
  await sb.from('expenses').delete().eq('id',id);
  loadData();
 }
}

async function loadData(){
 const {data}=await sb.from('expenses').select('*').order('date',{ascending:false});
 if(!data) return;
 totalAmount.innerText=data.reduce((s,i)=>s+i.amount,0).toLocaleString()+'원';

 history.innerHTML=data.map(i=>`
  <div class="item">
   <div>
    <b>${i.memo}</b><br><small>${i.date}</small>
    <div class="btns">
     <button class="edit small" onclick='editExpense(${JSON.stringify(i)})'>수정</button>
     <button class="del small" onclick='delExpense("${i.id}")'>삭제</button>
    </div>
   </div>
   <div>- ${i.amount.toLocaleString()}원</div>
  </div>
 `).join('');

 updateChart(data);
}

function updateChart(data){
 const cats=['식비','교통비','쇼핑','기타'];
 const sums=cats.map(c=>data.filter(i=>i.category===c).reduce((s,i)=>s+i.amount,0));
 if(chart)chart.destroy();
 const ctxChart = document.getElementById('expenseChart').getContext('2d');
 chart=new Chart(ctxChart,{
  type:'doughnut',
  data:{labels:cats,datasets:[{data:sums, backgroundColor:['#03c75a','#3498db','#f1c40f','#e74c3c']}]}
 });
}

/* ================= 테트리스 Pro (업그레이드된 로직) ================= */
const t_canvas = document.getElementById('tetris');
const t_ctx = t_canvas.getContext('2d');
t_ctx.scale(20, 20);

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;
let level = 1;
let isGameRunning = false;

const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };
const arena = createMatrix(10, 18);

function createPiece(type) {
    if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
    else if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
    else if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
    else if (type === 'O') return [[4, 4], [4, 4]];
    else if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
    else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
    else if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
}

function draw() {
    t_ctx.fillStyle = '#000';
    t_ctx.fillRect(0, 0, t_canvas.width, t_canvas.height);
    drawMatrix(arena, {x: 0, y: 0});
    drawMatrix(player.matrix, player.pos);
}

function drawMatrix(matrix, offset) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                t_ctx.fillStyle = ['#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'][value - 1];
                t_ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            }
        });
    });
}

function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
        }
    }
    return false;
}

function createMatrix(w, h) {
    const matrix = [];
    while (h--) matrix.push(new Array(w).fill(0));
    return matrix;
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
        });
    });
}

function arenaSweep() {
    let rowCount = 1;
    outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
    }
    level = Math.floor(player.score / 100) + 1;
    dropInterval = Math.max(100, 1000 - (level - 1) * 100);
    updateGameStats();
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) matrix.forEach(row => row.reverse());
    else matrix.reverse();
}

function playerDrop() {
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
    }
    dropCounter = 0;
}

function playerMove(dir) {
    player.pos.x += dir;
    if (collide(arena, player)) player.pos.x -= dir;
}

function playerRotate(dir) {
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
        }
    }
}

function playerReset() {
    const pieces = 'ILJOTSZ';
    player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
    if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        level = 1;
        dropInterval = 1000;
        updateGameStats();
    }
}

function updateGameStats() {
    document.getElementById('game-score').innerText = `점수: ${player.score}`;
    document.getElementById('game-level').innerText = `레벨: ${level}`;
}

function updateGame(time = 0) {
    if(!isGameRunning) return;
    const deltaTime = time - lastTime;
    lastTime = time;
    dropCounter += deltaTime;
    if (dropCounter > dropInterval) playerDrop();
    draw();
    requestAnimationFrame(updateGame);
}

// 게임 탭 클릭시 실행
function initTetris() {
    if(isGameRunning) return;
    isGameRunning = true;
    playerReset();
    updateGameStats();
    updateGame();
}

// 키보드 이벤트
document.addEventListener('keydown', event => {
    if (document.getElementById('game').classList.contains('hidden')) return;
    if (event.keyCode === 37) playerMove(-1);
    else if (event.keyCode === 39) playerMove(1);
    else if (event.keyCode === 40) playerDrop();
    else if (event.keyCode === 38) playerRotate(1);
});
</script>

</body>
</html>
