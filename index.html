<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마트 가계부 Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --primary:#03cf5d;
  --bg:#f4f6f8;
}
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:#fff;
}
.hidden{display:none}

h2{margin-bottom:20px}
input,button{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  font-size:14px;
}
input{border:1px solid #ddd}
button{
  border:none;
  cursor:pointer;
  font-weight:bold;
}
.google{background:#fff;border:1px solid #ddd}
.kakao{background:#fee500;color:#000}
.email{background:var(--primary);color:#fff}
.gray{background:#888;color:#fff}
.divider{
  margin:25px 0;
  font-size:12px;
  color:#aaa;
  position:relative;
}
.divider::before,
.divider::after{
  content:"";
  position:absolute;
  top:50%;
  width:40%;
  height:1px;
  background:#ddd;
}
.divider::before{left:0}
.divider::after{right:0}
header{
  background:var(--primary);
  color:#fff;
  padding:20px;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="auth" class="app" style="padding:60px 20px;text-align:center">

<h2 style="color:var(--primary)">스마트 가계부 Pro</h2>

<button class="google" onclick="oauthLogin('google')">
🔵 Google로 시작하기
</button>

<button class="kakao" onclick="oauthLogin('kakao')">
🟡 Kakao로 시작하기
</button>

<div class="divider">또는</div>

<input id="email" type="email" placeholder="이메일">
<input id="password" type="password" placeholder="비밀번호 (6자 이상)">

<button class="email" onclick="emailLogin()">이메일 로그인</button>
<button class="gray" onclick="emailSignup()">이메일 회원가입</button>

</div>

<!-- ================= MAIN ================= -->
<div id="main" class="app hidden">

<header>
  <span id="userEmail"></span>
  <span style="float:right;cursor:pointer" onclick="logout()">로그아웃</span>
  <h2 id="totalAmount">0원</h2>
</header>

<div style="padding:15px">
  <canvas id="expenseChart"></canvas>
</div>

</div>

<script>
/* ======================
   🔧 CONFIG (여기만 수정)
====================== */
const CONFIG = {
  SUPABASE: {
    URL: 'https://bynawxhwdshjjudwczju.supabase.co',
    ANON_KEY: 'sb_publishable_7Y23Naq_v7I7jAIszAVfUg_Hd5XRYwb'
  },
  OAUTH: {
    REDIRECT_URL: window.location.origin
  }
};

/* ======================
   INIT
====================== */
const sb = supabase.createClient(
  CONFIG.SUPABASE.URL,
  CONFIG.SUPABASE.ANON_KEY
);

// 자동 로그인
sb.auth.getSession().then(({ data }) => {
  if (data.session) showMain(data.session.user);
});

/* ======================
   AUTH
====================== */

// OAuth (Google / Kakao)
// 👉 회원가입 + 로그인 자동 처리
async function oauthLogin(provider){
  await sb.auth.signInWithOAuth({
    provider,
    options:{
      redirectTo: CONFIG.OAUTH.REDIRECT_URL
    }
  });
}

// Email 로그인
async function emailLogin(){
  const { data, error } = await sb.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });
  if (error) return alert(error.message);
  showMain(data.user);
}

// Email 회원가입
async function emailSignup(){
  const { error } = await sb.auth.signUp({
    email: email.value,
    password: password.value
  });
  if (error) alert(error.message);
  else alert("가입 완료! 로그인하세요.");
}

// 로그아웃
async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* ======================
   UI
====================== */
function showMain(user){
  auth.classList.add('hidden');
  main.classList.remove('hidden');
  userEmail.innerText = user.email || user.user_metadata?.name || '사용자';
}
</script>

</body>
</html>
